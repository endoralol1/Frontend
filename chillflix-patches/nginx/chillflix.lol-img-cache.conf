# Serve prebuilt webp from data/media-image-cache without hitting Next/sharp.
# URL: /api/img/<variant>/<stem>.(jpg|jpeg|png|webp)  ->  <cache>/<variant>/<stem>.webp
location ~ ^/api/img/(?<img_variant>card|w154|w185|w342|w500|w780|backdrop|backdropMd|logo)/(?<img_stem>[^/?#]+)\.(?:jpg|jpeg|png|webp)$ {
    root /var/www/chillflix.lol/data/media-image-cache;
    try_files /$img_variant/$img_stem.webp @chillflix_img_next;

    default_type image/webp;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Chillflix-Img "disk" always;
    access_log off;
}

location @chillflix_img_next {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_cache off;
}

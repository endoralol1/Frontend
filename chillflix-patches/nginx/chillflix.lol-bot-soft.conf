# Soft bot defense for www.chillflix.lol
# Complements Cloudflare Bot Fight Mode (do NOT rely on permanent Under Attack Mode).
# - Block obvious scraper UAs
# - Cap absurd ?page= on similar/recommendations (410, never hit Next)
# - Per-visitor rate limits on scrape / browse / soft API paths
# - Short timeouts so stuck scrape requests cannot fill worker connections
# Does NOT hard-block /api/cinepro playback or watch routes.

# Known bad bots — cheap reject before proxy
if ($chillflix_bad_bot) {
    return 403;
}

location ~* ^/(movie|tv)/[0-9]+/(similar|recommendations)/?$ {
    if ($chillflix_absurd_page) {
        return 410;
    }

    limit_req zone=cf_scrape burst=16 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_connect_timeout 5s;
    proxy_send_timeout 25s;
    proxy_read_timeout 25s;

    proxy_cache chillflix_html;
    proxy_cache_methods GET HEAD;
    proxy_cache_key "$scheme$request_method$host$request_uri$cookie_locale$http_cf_ipcountry";
    proxy_cache_valid 200 60s;
    proxy_cache_bypass $chillflix_skip_html_cache $http_upgrade;
    proxy_no_cache $chillflix_skip_html_cache $http_upgrade;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_hide_header Set-Cookie;
    add_header Cache-Control "public, max-age=60, stale-while-revalidate=120" always;
    add_header X-Chillflix-Cache $upstream_cache_status always;
}


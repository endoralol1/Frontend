# Visitor-aware access log (Cloudflare).
# Do NOT set real_ip from CF-Connecting-IP globally — cloudflare-only
# allowlists must keep seeing the Cloudflare edge as $remote_addr.

log_format chillflix_cf '$http_cf_connecting_ip|$remote_addr|$time_local|$request_method|$request_uri|$status|$body_bytes_sent|$http_referer|$http_user_agent|$http_cf_ipcountry|$http_cf_ray';

# Drop direct-to-IP / unknown-host traffic so scanners do not map this
# origin IP to chillflix via default cert or Location redirects.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/ssl/origin-default/cert.pem;
    ssl_certificate_key /etc/ssl/origin-default/key.pem;

    return 444;
}

# Huhu stream/proxy APIs live on chillflix Next (127.0.0.1:3000).
# Do NOT proxy out via https://www.chillflix.lol — origin IPv6 to CF hangs and
# saturates nginx/php so vuflix.co homepage stops opening.
location ^~ /api/huhu/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host www.chillflix.lol;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Accept-Encoding "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_buffering off;

    sub_filter_types *;
    sub_filter_once off;
    sub_filter "https://www.chillflix.lol/api/huhu/" "https://vuflix.co/api/huhu/";
    sub_filter "http://www.chillflix.lol/api/huhu/" "https://vuflix.co/api/huhu/";
    sub_filter "https://chillflix.lol/api/huhu/" "https://vuflix.co/api/huhu/";
    sub_filter "http://127.0.0.1:3000/api/huhu/" "https://vuflix.co/api/huhu/";
}

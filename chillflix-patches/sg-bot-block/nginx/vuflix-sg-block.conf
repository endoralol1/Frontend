# Include inside vuflix.co HTTPS server block (before location /).
# Requires maps from /etc/nginx/conf.d/chillflix-bot-soft-zones.conf ($cf_block_sg).

if ($chillflix_bad_bot) {
    return 403;
}

if ($cf_block_sg) {
    return 403;
}

location = /sg-unlock {
    add_header Set-Cookie "cf_human_ok=1; Path=/; Max-Age=604800; Secure; SameSite=Lax" always;
    add_header Cache-Control "no-store" always;
    return 302 /;
}

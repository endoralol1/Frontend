# Block trivial rippers on player proxies (curl/wget/python…).
# Include inside the vuflix.co HTTPS server block (before location /).
# Mirrors the /api/player/sources fastcgi style.

map $http_user_agent $vuflix_proxy_scraper {
    default 0;
    ~*(curl|wget|python-requests|python-urllib|scrapy|libwww-perl|Go-http-client|httpie|postman) 1;
}

location ^~ /api/player/media-proxy {
    if ($vuflix_proxy_scraper) { return 403; }
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param DOCUMENT_ROOT $document_root;
    fastcgi_param HTTPS on;
    fastcgi_param HTTP_X_FORWARDED_PROTO https;
    fastcgi_param HTTP_X_FORWARDED_HOST $host;
    fastcgi_pass unix:/run/php/php8.1-fpm.sock;
    fastcgi_read_timeout 300s;
    fastcgi_send_timeout 120s;
}

location ^~ /api/player/lang-proxy {
    if ($vuflix_proxy_scraper) { return 403; }
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param DOCUMENT_ROOT $document_root;
    fastcgi_param HTTPS on;
    fastcgi_param HTTP_X_FORWARDED_PROTO https;
    fastcgi_param HTTP_X_FORWARDED_HOST $host;
    fastcgi_pass unix:/run/php/php8.1-fpm.sock;
    fastcgi_read_timeout 300s;
    fastcgi_send_timeout 120s;
}

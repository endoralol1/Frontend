# Vuflix API soft limits (visitor = CF-Connecting-IP via $chillflix_visitor)
limit_req_zone $chillflix_visitor zone=vuflix_user_api:20m rate=3r/s;
limit_req_zone $chillflix_visitor zone=vuflix_sources:20m rate=4r/s;
limit_req_zone $chillflix_visitor zone=vuflix_inbox:10m rate=2r/s;
limit_conn_zone $chillflix_visitor zone=vuflix_relay_conn:20m;

# No auth cookie → skip PHP for user library spam
map $cookie_ns_session $vuflix_has_session {
    default 0;
    "~.+" 1;
}

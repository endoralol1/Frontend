# Insert BEFORE `location /api/` in chillflix.lol nginx site config.
# Serves Monetag aclib first-party (EasyList blocks acscdn.com and */aclib.js).
location = /api/rum {
    default_type application/javascript;
    add_header Cache-Control "public, max-age=600";
    add_header X-Content-Type-Options nosniff;
    alias /var/www/chillflix.lol/public/cdn/rum.js;
}

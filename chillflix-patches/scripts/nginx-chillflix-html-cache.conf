proxy_cache_path /var/cache/nginx/chillflix_html levels=1:2 keys_zone=chillflix_html:64m max_size=1g inactive=10m;

# Logged-in users always bypass anonymous HTML microcache.
map $http_cookie $chillflix_skip_html_cache_cookie {
    default 0;
    ~*chillflix_session 1;
}

# Discover/trending call TMDB live — do not cache empty/error HTML for 30s.
map $request_uri $chillflix_skip_html_cache_uri {
    default 0;
    ~*^/(movie|tv)/discover 1;
    ~*^/trending 1;
    ~*^/search 1;
}

map "$chillflix_skip_html_cache_cookie$chillflix_skip_html_cache_uri" $chillflix_skip_html_cache {
    default 0;
    ~*1 1;
}

# ScamGuard PHP app at /scamguard
location ^~ /scamguard/admin/app/ {
    root /var/www/chillflix.lol;
    try_files $uri $uri/ /scamguard/admin/app/index.html;
}

# Pretty SEO URLs: /scamguard/site/example.com
location ^~ /scamguard/site/ {
    rewrite ^/scamguard/site/([^/]+)/?$ /scamguard/check.php?d=$1 last;
}

# Phone / crypto / IBAN / card pretty URLs
location ^~ /scamguard/phone/ {
    rewrite ^/scamguard/phone/(.+?)/?$ /scamguard/check-entity.php?type=phone&q=$1 last;
}
location ^~ /scamguard/crypto/ {
    rewrite ^/scamguard/crypto/(.+?)/?$ /scamguard/check-entity.php?type=crypto&q=$1 last;
}
location ^~ /scamguard/iban/ {
    rewrite ^/scamguard/iban/(.+?)/?$ /scamguard/check-entity.php?type=iban&q=$1 last;
}
location ^~ /scamguard/card/ {
    rewrite ^/scamguard/card/(.+?)/?$ /scamguard/check-entity.php?type=card&q=$1 last;
}

location = /scamguard/sitemap.xml {
    rewrite ^ /scamguard/sitemap.php last;
}

location ^~ /scamguard/ {
    root /var/www/chillflix.lol;
    index index.php index.html;
    try_files $uri $uri/ /scamguard/index.php?$query_string;

    location ~ ^/scamguard/(config|includes|database|storage)/ {
        deny all;
        return 404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~* \.(sql|md|htaccess)$ {
        deny all;
        return 404;
    }
}

location = /scamguard {
    return 301 /scamguard/;
}

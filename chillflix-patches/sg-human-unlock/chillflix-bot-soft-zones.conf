# Soft bot defense zones (http context)
# Rate-limit by Cloudflare visitor IP — never by CF edge IP.

map $http_cf_connecting_ip $chillflix_visitor {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# page >= 21 — humans almost never deep-paginate similar/recommendations this far
# Quote regex: nginx treats bare { } specially in map values.
map $arg_page $chillflix_absurd_page {
    default 0;
    "~*^0*(2[1-9]|[3-9][0-9]|[1-9][0-9]{2,})$" 1;
}

# Obvious scrapers / SEO bots / headless HTTP clients (UA spoofers still need CF)
map $http_user_agent $chillflix_bad_bot {
    default 0;
    "" 1;
    "~*(?i)(semrushbot|ahrefsbot|dotbot|mj12bot|petalbot|bytespider|gptbot|claudebot|amazonbot|dataforseobot|splunk|masscan|nikto|sqlmap)" 1;
    "~*(?i)(python-requests|scrapy|httpx|go-http-client|libwww-perl|wget/|curl/|java/|okhttp|node-fetch|axios/)" 1;
}

# Singapore farm bots (GA Realtime ~97% SG / ~99% desktop). Cookie bypass: cf_human_ok=1
map $http_cf_ipcountry $cf_is_sg {
    default 0;
    SG 1;
}

map $cookie_cf_human_ok $cf_has_human_ok {
    default 0;
    "1" 1;
}

# Unlock + human gate pages must not loop on $cf_block_sg
map $uri $cf_sg_unlock_uri {
    default 0;
    /sg-unlock 1;
    /sg-unlock/ 1;
    /sg-gate.html 1;
}

# Block when SG + no unlock cookie + not on unlock/gate path → "100"
map "$cf_is_sg$cf_has_human_ok$cf_sg_unlock_uri" $cf_block_sg {
    default 0;
    "100" 1;
}

# Scrape-heavy HTML + deep links
limit_req_zone $chillflix_visitor zone=cf_scrape:20m rate=4r/s;
limit_req_zone $chillflix_visitor zone=cf_people:20m rate=2r/s;
# General movie/tv/search browse enumeration
limit_req_zone $chillflix_visitor zone=cf_browse:40m rate=6r/s;
# Soft API helpers used by homepage scrapers
limit_req_zone $chillflix_visitor zone=cf_api_soft:20m rate=8r/s;
# Singapore residual traffic (after WAF) — very tight
limit_req_zone $chillflix_visitor zone=cf_sg:10m rate=1r/s;

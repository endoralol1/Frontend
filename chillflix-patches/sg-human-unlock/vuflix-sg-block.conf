# Include inside vuflix.co HTTPS server block (before location /).
# Requires maps from /etc/nginx/conf.d/chillflix-bot-soft-zones.conf ($cf_block_sg).

if ($chillflix_bad_bot) {
    return 403;
}

# SG without unlock cookie → human gate (click Continue → /sg-unlock).
# Do NOT auto-set the cookie here or bot farms unlock themselves.
if ($cf_block_sg) {
    rewrite ^ /sg-gate.html last;
}

location = /sg-gate.html {
    root /var/www/chillflix-newsite/public;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
}

location = /sg-unlock {
    add_header Set-Cookie "cf_human_ok=1; Path=/; Max-Age=604800; Secure; SameSite=Lax" always;
    add_header Cache-Control "no-store" always;
    return 302 /;
}
